[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ottotone"
version = "0.1.0"
description = "A simple menu bar app for speech-to-text with global hotkeys"
readme = "README.md"
authors = ["Ottobots <ottobots@example.com>"]
license = "MIT"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
appdirs = "^1.4.4"
faster-whisper = "*"         # Let Poetry choose the best version
av = "*"                     # Let Poetry choose compatible av version
numpy = "^2.0.0"
torch = "^2.3.1"
torchaudio = "^2.3.1"
ctranslate2 = "*"            # Let Poetry choose compatible ctranslate2 version
tokenizers = "*"             # Let Poetry choose compatible tokenizers version
huggingface-hub = "*"        # Let Poetry choose compatible huggingface-hub version
onnxruntime = "^1.17.0"
pyobjc-core = "^10.2"
pyobjc-framework-Cocoa = "^10.2"
pyobjc-framework-Quartz = "^10.2"
pyobjc-framework-ApplicationServices = "^10.2"
pyobjc-framework-AVFoundation = "^10.2"
pyobjc-framework-CoreServices = "^10.2"
rumps = "^0.4.0"
psutil = "^5.9.8"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
pytest-cov = "^5.0.0"
black = "^24.0.0"
isort = "^5.13.0"
mypy = "^1.9.0"
py2app = "^0.28.8"

[tool.py2app]
application = ["src/__main__.py"]
name = "Ottotone"
datafiles = ["README.md", "LICENSE"]

# All py2app options need to be properly formatted in TOML
[tool.py2app.options]
argv_emulation = false
iconfile = "src/resources/icon.icns"

# No external frameworks needed as we use native AVFoundation
frameworks = []

# Set DYLD_LIBRARY_PATH at runtime
site_packages = true
dylib_excludes = [
    "libgcc_s.1.dylib",
    "libstdc++.6.dylib",
    "libSystem.dylib",
    "libportaudio.2.dylib",
    "libportaudiocpp.0.dylib",
    "libportaudio.dylib"
]

[tool.py2app.options.plist]
CFBundleName = "Ottotone"
CFBundleDisplayName = "Ottotone"
CFBundleIdentifier = "com.ottotone.speech-to-text"
CFBundleVersion = "0.1.0"
CFBundleShortVersionString = "0.1.0"
LSBackgroundOnly = true
LSUIElement = true
NSHumanReadableCopyright = "© 2025 Chris White"
NSMicrophoneUsageDescription = "Ottotone needs microphone access to record and transcribe your speech."

[tool.py2app.options.packages]
include = [
    "rumps",
    "faster_whisper",
    "av",
    "numpy",
    "torch",
    "torchaudio",
    "ctranslate2",
    "tokenizers",
    "huggingface_hub",
    "pyobjc",
    "AppKit",
    "Quartz",
    "Foundation",
    "ApplicationServices",
    "AVFoundation",
    "CoreServices",
    "CoreAudio"
]

[tool.py2app.options.excludes]
packages = [
    "tkinter",
    "matplotlib",
    "PyQt5",
    "PyQt6",
    "PySide2",
    "PySide6",
    "wx",
    "sounddevice"
]

# Entry points for the command-line interface
[tool.poetry.scripts]
ottotone = "src.__main__:main"


# Linting and formatting configuration
[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

# Test configuration
[tool.pytest.ini_options]
testpaths = ["__tests__"]
addopts = "-v --cov=src --cov-report=term-missing"
python_files = "test_*.py"
