[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ottotone"
version = "0.0.1"
description = "A simple menu bar app for speech-to-text with global hotkeys"
requires-python = ">=3.12"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
license-files = ["LICENSE"]

# Core dependencies
dependencies = [
    "appdirs>=1.4.4",         # For cross-platform config directories
    "faster-whisper>=0.9.0",  # Speech-to-text
    "sounddevice>=0.4.8",     # Audio recording (latest as of 2023)
    "numpy>=2.0.0",           # Audio processing (latest major as of 2024)
    "torch>=2.3.0",           # PyTorch for faster-whisper (latest stable as of 2024)
    "torchaudio>=2.3.0",      # Audio processing for PyTorch
    "ctranslate2>=4.0.0",     # CTranslate2 for faster-whisper (latest stable)
    "tokenizers>=0.15.0",     # Tokenization for faster-whisper
    "huggingface-hub>=0.20.0", # For downloading models (latest stable)
    "onnxruntime>=1.17.0",     # ONNX runtime for faster-whisper
    "pyobjc-core>=10.2",         # PyObjC core (update version as needed)
    "pyobjc-framework-Cocoa>=10.2", # For AppKit, Foundation (update version as needed)
    "pyobjc-framework-Quartz>=10.2", # For event taps, CoreGraphics (update version as needed)
    "pyobjc-framework-ApplicationServices>=10.2", # For Accessibility APIs (update version as needed)
    "pyobjc-framework-AVFoundation>=10.2"  # For audio/video, microphone permissions (update version as needed)
]

# Development and testing dependencies
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.9.0"
]

# Platform-specific dependencies
macos = [
    "rumps>=0.4.0",       # Menu bar app for macOS
    "py2app>=0.28.8"      # Bundle as a macOS app (latest stable)
]

windows = [
    "pywin32>=306"        # Windows system integration (latest stable)
]

linux = [
    "pycairo>=1.26.0",    # GTK integration (latest stable)
    "pygobject>=3.48.0"    # GTK integration (latest stable)
]

# Entry points for the command-line interface
[project.scripts]
ottotone = "ottotone.__main__:main"

# Package configuration
[tool.setuptools]
package-dir = { "" = "." }
packages = ["ottotone"]
include-package-data = true


# Linting and formatting configuration
[tool.black]
line-length = 88
target-version = ['py38']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

# Test configuration
[tool.pytest.ini_options]
testpaths = ["__tests__"]
addopts = "-v --cov=ottotone --cov-report=term-missing"
python_files = "test_*.py"
