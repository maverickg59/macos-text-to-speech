[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "ottotone"
version = "0.0.1"
description = "A simple menu bar app for speech-to-text with global hotkeys"
readme = "README.md"
authors = ["Ottobots <ottobots@example.com>"]
license = "MIT"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
appdirs = "^1.4.4"
# Core ML/Audio dependencies with specific compatible versions
faster-whisper = "^1.1.1"  # Latest version
av = "^14.4.0"  # Latest version compatible with faster-whisper
numpy = "^2.2.6"  # Latest version compatible with the stack
torch = "^2.7.0"  # Latest version compatible with the stack
torchaudio = "^2.7.0"  # Must match torch version
ctranslate2 = "^4.6.0"  # Version compatible with faster-whisper
tokenizers = "^0.21.1"  # Version compatible with faster-whisper
huggingface-hub = "^0.32.2"  # Version compatible with faster-whisper
onnxruntime = "^1.22.0"  # Latest version compatible with the stack
# macOS-specific dependencies
pyobjc-core = "^10.3.2"  # Latest version
pyobjc-framework-Cocoa = "^10.3.2"  # Latest version
pyobjc-framework-Quartz = "^10.3.2"  # Latest version
pyobjc-framework-ApplicationServices = "^10.3.2"  # Latest version
pyobjc-framework-AVFoundation = "^10.3.2"  # Latest version
pyobjc-framework-CoreServices = "^10.3.2"  # Latest version
rumps = "^0.4.0"  # Latest version
psutil = "^7.0.0"  # Updated to latest version
python-dotenv = "^1.1.0"  # Updated to latest version

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.5"  # Latest version
pytest-cov = "^6.1.1"  # Updated to latest version
black = "^25.1.0"  # Updated to latest version
isort = "^6.0.1"  # Updated to latest version
mypy = "^1.16.0"  # Latest version
py2app = "^0.28.8"  # Latest version

[tool.py2app]
application = ["src/__main__.py"]
name = "Ottotone"
datafiles = ["README.md", "LICENSE"]

# All py2app options need to be properly formatted in TOML
[tool.py2app.options]
argv_emulation = false
iconfile = "src/resources/icon.icns"

# No external frameworks needed as we use native AVFoundation
frameworks = []

# Set DYLD_LIBRARY_PATH at runtime
site_packages = true
dylib_excludes = [
    "libgcc_s.1.dylib",
    "libstdc++.6.dylib",
    "libSystem.dylib",
    "libportaudio.2.dylib",
    "libportaudiocpp.0.dylib",
    "libportaudio.dylib"
]

[tool.py2app.options.plist]
CFBundleName = "Ottotone"
CFBundleDisplayName = "Ottotone"
CFBundleIdentifier = "com.ottotone.speech-to-text"
CFBundleVersion = "0.0.1"
CFBundleShortVersionString = "0.0.1"
LSBackgroundOnly = true
LSUIElement = true
NSHumanReadableCopyright = "© 2025 Chris White"
NSMicrophoneUsageDescription = "Ottotone needs microphone access to record and transcribe your speech."

[tool.py2app.options.packages]
include = [
    "rumps",
    "faster_whisper",
    "av",
    "numpy",
    "torch",
    "torchaudio",
    "ctranslate2",
    "tokenizers",
    "huggingface_hub",
    "pyobjc",
    "AppKit",
    "Quartz",
    "Foundation",
    "ApplicationServices",
    "AVFoundation",
    "CoreServices",
    "CoreAudio"
]

[tool.py2app.options.excludes]
packages = [
    "tkinter",
    "matplotlib",
    "PyQt5",
    "PyQt6",
    "PySide2",
    "PySide6",
    "wx",
    "sounddevice"
]

# Entry points for the command-line interface
[tool.poetry.scripts]
ottotone = "src.__main__:main"


# Linting and formatting configuration
[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

# Test configuration
[tool.pytest.ini_options]
testpaths = ["__tests__"]
addopts = "-v --cov=src --cov-report=term-missing"
python_files = "test_*.py"
